[package]
name = "pomo"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pomor"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "5"
anyhow = "1"
signal-hook = "0.3"
notify-rust = { version = "4", optional = true }
rodio = "0.20"

[features]
notify = ["dep:notify-rust"]
